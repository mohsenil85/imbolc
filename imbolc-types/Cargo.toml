[package]
name = "imbolc-types"
version = "0.1.0"
edition = "2021"

[features]
default = []
ipc = ["dep:serde_json", "dep:dirs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
dirs = { version = "5", optional = true }

[dev-dependencies]
serde_json = "1"
toml = "0.8"
