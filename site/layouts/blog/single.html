{{ define "main" }}
<main class="blog-post">
  <div class="container">
    <article>
      <header>
        <h1>{{ .Title }}</h1>
        <div class="post-meta">
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
          · {{ .ReadingTime }} min read
        </div>
      </header>
      <div class="post-body">
        {{ .Content }}
      </div>
    </article>
    <a href="/blog/" class="back-link">&larr; Back to blog</a>
  </div>
</main>
{{ end }}
